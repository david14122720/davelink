# daveLinK — Docker Compose
# PostgreSQL database for daveLinK URL shortener

services:
  postgres:
    image: postgres:16-alpine
    container_name: davelink-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: linksnap
      POSTGRES_USER: linksnap
      POSTGRES_PASSWORD: linksnap_pass_2024
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linksnap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
